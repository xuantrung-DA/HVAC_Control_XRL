shield:
  enabled_by_default: true
  projection_steps: 2
  uncertainty_multiplier: 1.0
  reliability_fallback_threshold: 0.20
  high_context_risk_threshold: 0.65
  thermal_clamp_medium_risk: 0.45
  thermal_clamp_high_risk: 0.75
  co2_clamp_medium_risk: 0.35
  co2_clamp_high_risk: 0.70
  overcool_reject_margin_c: 0.30
  projected_temperature_tolerance_c: 0.20
  projected_co2_tolerance_ppm: 20.0
  fallback_controller: conservative_rule_based_v2

metrics:
  decisions: [ALLOW, CLAMP, REJECT, FALLBACK]
  track_intervention_rate: true
  track_fallback_rate: true
  normal_day_intervention_target_max: 0.20
  normal_day_fallback_target_max: 0.05
