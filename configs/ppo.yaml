agent:
  name: ppo
  seed: 42
  device: auto

model:
  policy: MlpPolicy
  hidden_sizes: [128, 128]
  activation: tanh

optimization:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.20
  ent_coef: 0.01
  vf_coef: 0.50
  max_grad_norm: 0.50

training:
  total_timesteps: 50000
  n_steps: 768
  batch_size: 64
  n_epochs: 10
  evaluation_frequency: 5000
  evaluation_episodes: 10
  checkpoint_frequency: 10000

smoke_test:
  total_timesteps: 20000
  n_steps: 96
  batch_size: 32

checkpoint:
  directory: models/ppo
  filename: ppo
