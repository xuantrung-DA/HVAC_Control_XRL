agent:
  name: dqn
  seed: 42
  device: auto

model:
  hidden_sizes: [128, 128]
  activation: relu

replay_buffer:
  capacity: 50000
  batch_size: 64
  warmup_steps: 1000

optimization:
  learning_rate: 0.0005
  gamma: 0.99
  reward_scale: 0.10
  gradient_clip_norm: 10.0
  train_frequency: 4
  target_update_frequency: 500

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 25000

training:
  episodes: 750
  evaluation_frequency: 25
  evaluation_episodes: 10
  log_frequency: 10
  checkpoint_frequency: 50

smoke_test:
  total_steps: 15000
  replay_buffer_capacity: 20000
  warmup_steps: 512

checkpoint:
  directory: models/dqn
  filename: dqn.pt
